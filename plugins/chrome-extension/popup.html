<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O11yIA BR - Copilot Metrics</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 16px;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    
    .header h1 {
      font-size: 16px;
      font-weight: 600;
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #888;
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ecdc4;
    }
    
    .status-dot.offline {
      background: #ff6b6b;
    }
    
    .card {
      background: #252542;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    
    .card-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 8px;
    }
    
    .metric-value {
      font-size: 28px;
      font-weight: 700;
      color: #4ecdc4;
    }
    
    .metric-unit {
      font-size: 12px;
      color: #888;
      margin-left: 4px;
    }
    
    .progress-bar {
      height: 6px;
      background: #333;
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4ecdc4, #44a08d);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    
    .progress-fill.warning {
      background: linear-gradient(90deg, #f9c74f, #f77f00);
    }
    
    .progress-fill.danger {
      background: linear-gradient(90deg, #ff6b6b, #c0392b);
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    
    .stat-item {
      background: #1a1a2e;
      padding: 8px;
      border-radius: 4px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 16px;
      font-weight: 600;
    }
    
    .stat-label {
      font-size: 10px;
      color: #888;
      margin-top: 2px;
    }
    
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    
    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #4ecdc4;
      color: #1a1a2e;
      font-weight: 600;
    }
    
    .btn-primary:hover {
      background: #44a08d;
    }
    
    .btn-secondary {
      background: #333;
      color: #eee;
    }
    
    .btn-secondary:hover {
      background: #444;
    }
    
    .user-info {
      font-size: 11px;
      color: #888;
      margin-top: 12px;
      text-align: center;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #888;
    }
    
    .error {
      color: #ff6b6b;
      font-size: 12px;
      text-align: center;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>O11yIA BR</h1>
      <div class="status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Conectando...</span>
      </div>
    </div>
  </div>
  
  <div id="content">
    <div class="loading">Carregando métricas...</div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
