<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>O11yIA BR - Configurações</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      padding: 24px;
      min-width: 400px;
    }
    
    h1 {
      font-size: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    
    label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 6px;
    }
    
    input[type="text"],
    input[type="password"],
    input[type="url"] {
      width: 100%;
      padding: 10px 12px;
      background: #252542;
      border: 1px solid #333;
      border-radius: 4px;
      color: #eee;
      font-size: 14px;
    }
    
    input:focus {
      outline: none;
      border-color: #4ecdc4;
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #4ecdc4;
    }
    
    .checkbox-label {
      font-size: 14px;
      text-transform: none;
      color: #eee;
    }
    
    .hint {
      font-size: 11px;
      color: #666;
      margin-top: 4px;
    }
    
    .actions {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }
    
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #4ecdc4;
      color: #1a1a2e;
      font-weight: 600;
    }
    
    .btn-primary:hover {
      background: #44a08d;
    }
    
    .btn-secondary {
      background: #333;
      color: #eee;
    }
    
    .btn-secondary:hover {
      background: #444;
    }
    
    .message {
      margin-top: 16px;
      padding: 10px;
      border-radius: 4px;
      font-size: 13px;
    }
    
    .message.success {
      background: #1d4a3f;
      color: #4ecdc4;
    }
    
    .message.error {
      background: #4a1d1d;
      color: #ff6b6b;
    }
    
    .divider {
      height: 1px;
      background: #333;
      margin: 24px 0;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #4ecdc4;
    }
  </style>
</head>
<body>
  <h1>⚙️ Configurações</h1>
  
  <form id="configForm">
    <div class="section-title">Servidor Central</div>
    
    <div class="form-group">
      <label for="serverUrl">URL do Servidor</label>
      <input type="url" id="serverUrl" placeholder="http://servidor:8080" required>
      <div class="hint">Endereço do servidor O11yIA BR</div>
    </div>
    
    <div class="form-group">
      <label for="userId">ID do Usuário</label>
      <input type="text" id="userId" placeholder="usuario@empresa.gov.br" required>
      <div class="hint">Seu email corporativo para identificação</div>
    </div>

    <div class="form-group">
      <label for="apiKey">API Key</label>
      <input type="password" id="apiKey" placeholder="dev-key-1" autocomplete="off">
      <div class="hint">Chave de ingestão (header X-API-Key). Obrigatória para enviar métricas.</div>
    </div>

    <div class="divider"></div>

    <div class="section-title">Identificação (opcional)</div>

    <div class="form-group">
      <label for="team">Time</label>
      <input type="text" id="team" placeholder="ex: plataforma">
      <div class="hint">Time associado às métricas (opcional)</div>
    </div>

    <div class="form-group">
      <label for="project">Projeto</label>
      <input type="text" id="project" placeholder="ex: portal-cidadao">
      <div class="hint">Projeto associado às métricas (opcional)</div>
    </div>

    <div class="divider"></div>

    <div class="section-title">Monitoramento</div>
    
    <div class="form-group">
      <div class="checkbox-group">
        <input type="checkbox" id="enabled" checked>
        <label for="enabled" class="checkbox-label">Ativar coleta de métricas</label>
      </div>
    </div>
    
    <div id="message"></div>
    
    <div class="actions">
      <button type="submit" class="btn-primary">Salvar</button>
      <button type="button" class="btn-secondary" id="testBtn">Testar Conexão</button>
    </div>
  </form>
  
  <script src="options.js"></script>
</body>
</html>
