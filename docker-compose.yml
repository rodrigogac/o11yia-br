version: "3.9"

services:
  # Backend API - Receptor de métricas
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: o11yia-api
    ports:
      - "8080:8080"
    volumes:
      - o11yia-data:/data
    environment:
      - DATABASE_PATH=/data/metrics.db
      # Autenticação (CONTRATO):
      #   O11YIA_API_KEYS  : chaves válidas p/ ingestão/query (X-API-Key), separadas por vírgula.
      #   O11YIA_ADMIN_KEY : chave dos endpoints /v1/admin/* (X-Admin-Key).
      #   O11YIA_AUTH_DISABLED=true desliga toda a auth (modo dev/PoC).
      # Troque os valores abaixo por segredos reais em produção.
      - O11YIA_API_KEYS=dev-key-1,dev-key-2
      - O11YIA_ADMIN_KEY=dev-admin-key
      # CORS: origens permitidas (separadas por vírgula). Default = dashboard local.
      - O11YIA_CORS_ORIGINS=http://localhost:8501
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dashboard Streamlit
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: o11yia-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  o11yia-data:
    name: o11yia-metrics-data
